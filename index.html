<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Bookshelf — your reading life, beautifully organized. Track books, shelves, progress, and reading goals." />
    <meta name="color-scheme" content="light dark" />
    <!-- Apply stored theme and reading preferences before first paint, so nothing flashes. -->
    <script>
      try {
        var root = document.documentElement;
        var t = localStorage.getItem('bookshelf:theme');
        if (t === 'light' || t === 'dark') root.dataset.theme = t;
        // Reading preferences (see src/lib/preferences.ts): same attributes, before first paint.
        var p = JSON.parse(localStorage.getItem('bookshelf:reading') || '{}');
        var more = p.contrast === 'more' || (p.contrast !== 'standard' && matchMedia('(prefers-contrast: more)').matches);
        if (more) root.dataset.contrast = 'more';
        if (p.textSize === 'large' || p.textSize === 'larger') root.dataset.text = p.textSize;
        if (p.spacing === 'relaxed') root.dataset.spacing = 'relaxed';
        if (p.font === 'dyslexic') root.dataset.font = 'dyslexic';
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://covers.openlibrary.org" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <title>Bookshelf — Your reading life, beautifully organized</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
